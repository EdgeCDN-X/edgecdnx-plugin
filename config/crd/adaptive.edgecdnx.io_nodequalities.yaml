apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodequalities.adaptive.edgecdnx.io
spec:
  group: adaptive.edgecdnx.io
  scope: Namespaced
  names:
    plural: nodequalities
    singular: nodequality
    kind: NodeQuality
    shortNames: [nq]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: State, type: string, jsonPath: .status.state}
        - {name: Weight, type: integer, jsonPath: .status.effectiveWeight}
        - {name: Observed, type: date, jsonPath: .status.observedAt}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [nodeName, location, staticCapacity, enabled]
              properties:
                nodeName: {type: string, minLength: 1}
                location: {type: string, minLength: 1}
                staticCapacity: {type: integer, format: int32, minimum: 1}
                enabled: {type: boolean}
            status:
              type: object
              properties:
                observedAt: {type: string, format: date-time, nullable: true}
                sampleCount: {type: integer, format: int64, minimum: 0}
                latencyEWMAMillis: {type: number, minimum: 0}
                errorEWMA: {type: number, minimum: 0, maximum: 1}
                cacheHitRatio: {type: number, minimum: 0, maximum: 1}
                activeRequests: {type: integer, format: int32, minimum: 0}
                concurrencyLimit: {type: integer, format: int32, minimum: 0}
                qualityScore: {type: number, minimum: 0, maximum: 1}
                effectiveWeight: {type: integer, format: int32, minimum: 0, maximum: 100}
                state: {type: string, enum: [Unknown, Healthy, Degraded, Ejected, Recovering, Stale, Disabled]}
                stateSince: {type: string, format: date-time, nullable: true}
                ejectionCount: {type: integer, format: int32, minimum: 0}
                consecutiveFailures: {type: integer, format: int32, minimum: 0}
                consecutiveHealthy: {type: integer, format: int32, minimum: 0}
                recoveryStep: {type: integer, format: int32, minimum: 0, maximum: 3}
                lastFailureType: {type: string, enum: ['', origin_5xx, connect_timeout, request_timeout, client_cancel, probe_failure, metrics_stale]}
                ejectedUntil: {type: string, format: date-time, nullable: true}
                reason: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer, format: int64}
