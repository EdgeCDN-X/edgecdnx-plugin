apiVersion: v1
kind: ServiceAccount
metadata: {name: quality-controller, namespace: edge-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: quality-controller, namespace: edge-system}
rules:
  - apiGroups: [adaptive.edgecdnx.io]
    resources: [nodequalities]
    verbs: [get, list, watch]
  - apiGroups: [adaptive.edgecdnx.io]
    resources: [nodequalities/status]
    verbs: [get, patch, update]
  - apiGroups: [infrastructure.edgecdnx.com]
    resources: [locations]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: quality-controller, namespace: edge-system}
subjects:
  - {kind: ServiceAccount, name: quality-controller, namespace: edge-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: quality-controller}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-controller
  namespace: edge-system
  labels: {app.kubernetes.io/name: quality-controller, app.kubernetes.io/part-of: edgeroute}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: quality-controller}}
  template:
    metadata: {labels: {app.kubernetes.io/name: quality-controller, app.kubernetes.io/part-of: edgeroute}}
    spec:
      serviceAccountName: quality-controller
      containers:
        - name: controller
          image: edgeroute-quality-controller:dev
          imagePullPolicy: IfNotPresent
          args: [--reconcile-interval=5s]
          ports: [{name: metrics, containerPort: 8080}, {name: health, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 2, periodSeconds: 2}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: quality-controller
  namespace: edge-system
  labels: {app.kubernetes.io/name: quality-controller, app.kubernetes.io/part-of: edgeroute}
spec:
  selector: {app.kubernetes.io/name: quality-controller}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: quality-controller, namespace: monitoring}
spec:
  namespaceSelector: {matchNames: [edge-system]}
  selector: {matchLabels: {app.kubernetes.io/name: quality-controller, app.kubernetes.io/part-of: edgeroute}}
  endpoints: [{port: metrics, path: /metrics, interval: 5s}]
