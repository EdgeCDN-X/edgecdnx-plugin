apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  labels:
    app.kubernetes.io/name: mediamtx
    app.kubernetes.io/part-of: edgeroute
    node: origin
    location: origin
    service: hls-demo
spec:
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - {name: rtmp, port: 1935, targetPort: rtmp}
    - {name: hls, port: 8888, targetPort: hls}
    - {name: api, port: 9997, targetPort: api}
    - {name: metrics, port: 9998, targetPort: metrics}
