apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: edgeroute
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: edgeroute
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.4-alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
          imagePullPolicy: IfNotPresent
          args: [nginx, -c, /config/nginx.conf, -g, 'daemon off;']
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: logs, mountPath: /var/log/nginx}
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
          imagePullPolicy: IfNotPresent
          args:
            - -host=0.0.0.0
            - -config=/config/toxiproxy.json
            - -proxy-metrics
            - -runtime-metrics
          ports:
            - {name: proxy-api, containerPort: 8474}
            - {name: origin-proxy, containerPort: 8666}
          readinessProbe:
            tcpSocket: {port: origin-proxy}
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.1@sha256:9f6d963bb2b19d706d401cc3e2c3ea8de2f1c471b96a2156ca45e76f650b1625
          imagePullPolicy: IfNotPresent
          args: [--nginx.scrape-uri=http://127.0.0.1:8080/stub_status]
          ports:
            - {name: nginx-metrics, containerPort: 9113}
          readinessProbe:
            httpGet: {path: /metrics, port: nginx-metrics}
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
        - name: nginx-log-exporter
          image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0@sha256:b36976cb58584529381a92404a7ba9868b03e1a321c9dc7228cc9ecd93a80440
          imagePullPolicy: IfNotPresent
          args: [-config-file, /config/exporter.hcl]
          ports:
            - {name: log-metrics, containerPort: 4040}
          readinessProbe:
            httpGet: {path: /metrics, port: log-metrics}
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 200m, memory: 96Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: logs, mountPath: /var/log/nginx, readOnly: true}
      volumes:
        - name: config
          configMap: {name: edge-config}
        - name: cache
          emptyDir: {sizeLimit: 256Mi}
        - name: logs
          emptyDir: {sizeLimit: 64Mi}
