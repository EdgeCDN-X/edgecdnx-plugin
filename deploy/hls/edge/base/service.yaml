apiVersion: v1
kind: Service
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: edgeroute
spec:
  selector:
    app.kubernetes.io/name: edge
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: toxiproxy-api, port: 8474, targetPort: proxy-api}
    - {name: nginx-metrics, port: 9113, targetPort: nginx-metrics}
    - {name: log-metrics, port: 4040, targetPort: log-metrics}
