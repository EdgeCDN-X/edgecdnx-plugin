apiVersion: v1
kind: ServiceAccount
metadata:
  name: edgeroute-coredns
  namespace: edge-system
  labels:
    app.kubernetes.io/name: edgeroute-coredns
    app.kubernetes.io/part-of: edgeroute
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edgeroute-coredns-reader
  namespace: edge-system
rules:
  - apiGroups: [infrastructure.edgecdnx.com]
    resources: [zones, services, locations, prefixlists]
    verbs: [get, list, watch]
  - apiGroups: [adaptive.edgecdnx.io]
    resources: [nodequalities]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edgeroute-coredns-reader
  namespace: edge-system
subjects:
  - kind: ServiceAccount
    name: edgeroute-coredns
    namespace: edge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: edgeroute-coredns-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edgeroute-coredns
  namespace: edge-system
data:
  Corefile: |
    .:53 {
      errors
      health :8080
      ready :8181
      edgecdnx . {
        namespace edge-system
        soa ns1
        recordttl 30
        defaultweight 100
        routingmode adaptive
        dnsresponsetype A_AAAA
        grpcresponsetype CNAME
      }
      prometheus :9153
      forward . 10.96.0.10
      reload
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeroute-coredns
  namespace: edge-system
  labels:
    app.kubernetes.io/name: edgeroute-coredns
    app.kubernetes.io/part-of: edgeroute
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edgeroute-coredns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgeroute-coredns
        app.kubernetes.io/part-of: edgeroute
    spec:
      serviceAccountName: edgeroute-coredns
      containers:
        - name: coredns
          image: edgeroute-coredns:dev
          imagePullPolicy: Never
          args: [-conf, /etc/coredns/Corefile]
          ports:
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: metrics, containerPort: 9153, protocol: TCP}
            - {name: health, containerPort: 8080, protocol: TCP}
            - {name: ready, containerPort: 8181, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ready, port: ready}
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/coredns, readOnly: true}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: config
          configMap:
            name: edgeroute-coredns
---
apiVersion: v1
kind: Service
metadata:
  name: edgeroute-coredns
  namespace: edge-system
  labels:
    app.kubernetes.io/name: edgeroute-coredns
    app.kubernetes.io/part-of: edgeroute
spec:
  selector:
    app.kubernetes.io/name: edgeroute-coredns
  ports:
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
    - {name: metrics, port: 9153, targetPort: metrics, protocol: TCP}
